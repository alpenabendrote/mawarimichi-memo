// Preserve legal text that Android packaging would otherwise merge or discard.
// This task reads already resolved build dependencies; it makes no app-time requests.
def nativeNoticesDir = layout.buildDirectory.dir('generated/nativeNotices/assets')
abstract class NativeNoticesTask extends DefaultTask {
    @org.gradle.api.tasks.OutputDirectory
    abstract org.gradle.api.file.DirectoryProperty getOutputDirectory()
}
def nativeNotices = tasks.register('generateNativeNotices', NativeNoticesTask) {
    outputDirectory.set(nativeNoticesDir)
    outputs.upToDateWhen { false }
    doLast {
        def sections = []
        def approvedApache = { String group ->
            group.startsWith('androidx.') ||
            group in ['org.jetbrains', 'org.jetbrains.kotlin', 'org.jetbrains.kotlinx', 'org.apache.cordova', 'org.jspecify', 'com.google.guava', 'com.google.errorprone']
        }
        def addZipNotices
        addZipNotices = { byte[] bytes, String origin ->
            def zip = new java.util.zip.ZipInputStream(new ByteArrayInputStream(bytes))
            try {
                def entry
                while ((entry = zip.nextEntry) != null) {
                    if (entry.directory) continue
                    def name = entry.name
                    if (name ==~ /(?i)(.*\/)?(LICENSE|LICENCE|NOTICE|COPYRIGHT)([._-].*)?/) {
                        sections << origin + '!/' + name + '\n\n' + new String(zip.readAllBytes(), java.nio.charset.StandardCharsets.UTF_8)
                    } else if (name.endsWith('.jar')) {
                        addZipNotices(zip.readAllBytes(), origin + '!/' + name)
                    }
                }
            } finally { zip.close() }
        }
        // Filter project components before artifact selection: Android projects publish
        // many artifact variants, while this collector only needs external AARs/JARs.
        def artifacts = configurations.releaseRuntimeClasspath.incoming.artifactView {
            componentFilter { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
        }.artifacts.artifacts.sort { it.id.componentIdentifier.toString() }
        def unknown = artifacts.findAll {
            def id = it.id.componentIdentifier
            !approvedApache(id.group) && !(id.group == 'io.ionic.libs' && id.module == 'ionfilesystem-android' && id.version == '1.1.1')
        }
        logger.lifecycle('Native notice inventory: ' + artifacts.collect { it.id.componentIdentifier }.join(', '))
        if (unknown) throw new GradleException('Review native licenses before distributing: ' + unknown.collect { it.id.componentIdentifier }.join(', '))
        artifacts.each { artifact ->
            def id = artifact.id.componentIdentifier
            sections << id.toString() + '\nDeclared license: ' + (approvedApache(id.group) ? 'Apache-2.0' : 'MIT')
            addZipNotices(artifact.file.bytes, id.toString())
        }
        sections << rootProject.file('../THIRD_PARTY_NOTICES.txt').getText('UTF-8')
        def output = nativeNoticesDir.get().file('native-third-party-notices.txt').asFile
        output.parentFile.mkdirs()
        output.setText(sections.join('\n\n' + ('=' * 72) + '\n\n') + '\n', 'UTF-8')
    }
}
// Register the producing task with AGP so merge-assets and release lint both
// carry its dependency, including when different variants are built in order.
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    variant.sources.assets.addGeneratedSourceDirectory(nativeNotices) { task -> task.outputDirectory }
}
