name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'src/**', 'public/**', 'licenses/**', 'LICENSE', 'THIRD_PARTY_NOTICES.txt', 'capacitor.config.json', 'vite.config.ts', 'index.html', 'package*.json', 'scripts/**', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - run: chmod +x android/gradlew
      - name: Build installable debug APK
        run: ./android/gradlew -p android assembleDebug -PappVersionCode=$GITHUB_RUN_NUMBER --no-daemon
      - name: Verify release APK permissions, legal texts and non-debuggable build
        run: |
          ./android/gradlew -p android assembleRelease -PappVersionCode=$GITHUB_RUN_NUMBER --no-daemon
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" manifest print android/app/build/outputs/apk/release/app-release-unsigned.apk > /tmp/quantum-notepad-release-manifest.xml
          python3 scripts/verify-apk.py android/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/quantum-notepad-release-manifest.xml
      - uses: actions/upload-artifact@v7
        with:
          name: quantum-notepad-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Free space for Android emulator
        run: |
          sudo rm -rf -- /usr/share/dotnet
          df -h .
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Offline Android smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 4G
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            ./android/gradlew -p android connectedSmokeAndroidTest --no-daemon
      - name: Native dependency notices
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-third-party-notices
          path: android/app/build/generated/nativeNotices/assets/native-third-party-notices.txt
          if-no-files-found: error
      - name: Android test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: android/app/build/reports/androidTests
          if-no-files-found: ignore
